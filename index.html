function prevOn(b,s,src){
 if(b.querySelector('.pv'))return;
 const v=document.createElement('video');v.className='pv';v.muted=true;v.playsInline=true;v.preload='auto';v.src=src;
 v.addEventListener('loadedmetadata',()=>{try{v.currentTime=s}catch(e){}const p=v.play();if(p&&p.catch)p.catch(()=>{})});
 v.addEventListener('playing',()=>{v.style.opacity=1});
 v.addEventListener('timeupdate',()=>{if(v.currentTime>s+2.6){try{v.currentTime=s}catch(e){}}});
 v.addEventListener('ended',()=>{try{v.currentTime=s;v.play()}catch(e){}});
 b.appendChild(v);
}
function prevOff(b){const v=b.querySelector('.pv');if(v){v.pause();v.removeAttribute('src');v.load();v.remove()}}
function renderClips(){

 el.querySelectorAll('.cl').forEach(b=>{const c=CLIPS[+b.dataset.clip],s=c.s;
  b.addEventListener('mouseenter',()=>prevOn(b,s,c.v));b.addEventListener('mouseleave',()=>prevOff(b));
  b.addEventListener('focus',()=>prevOn(b,s,c.v));b.addEventListener('blur',()=>prevOff(b))});
}

const DEFMUS=[{name:'Night Drive',g:'nightDrive'},{name:'Heat Haze',g:'heatHaze'},{name:'Deep Dive',g:'deepDive'}];
const GENF={nightDrive,heatHaze,deepDive};
let actx=null,master=null,genStop=null,fileAud=null,advT=null,mIdx=0,mPlaying=true,mVol=.6,tracks=JSON.parse(JSON.stringify(CFG.music||DEFMUS));
function ensureCtx(){if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=mVol;master.connect(actx.destination)}return actx}
function osc(type,f,t0,dur,gain,dest){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(gain,t0+Math.min(.03,dur/4));g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+dur+.05)}
function nightDrive(bus){
 const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(bus);
 const bass=[55,55,65.41,55,73.42,55,65.41,49],lead=[220,261.63,329.63,293.66],sp=60/96/2;
 let step=0,next=actx.currentTime+.1;
 const id=setInterval(()=>{while(next<actx.currentTime+.4){const tm=next;
  osc('sawtooth',bass[step%8],tm,sp*1.8,.2,lp);
  if(step%16===0)[110,130.81,164.81].forEach(f=>osc('sine',f,tm,sp*14,.06,bus));
  if(step%4===2)osc('triangle',lead[(step>>2)%4],tm,sp*3,.07,lp);
  next+=sp;step++}},100);
 return()=>clearInterval(id)}
function heatHaze(bus){
 const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=500;f.Q.value=6;f.connect(bus);
 const lfo=actx.createOscillator(),lg=actx.createGain();lfo.frequency.value=.08;lg.gain.value=300;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
 const os=[55,55.3,82.4,110].map(fr=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';o.frequency.value=fr;g.gain.value=.07;o.connect(g);g.connect(f);o.start();return o});
 return()=>{os.forEach(o=>o.stop());lfo.stop()}}
function deepDive(bus){
 const pads=[130.81,196,261.63,329.63].map(fr=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=fr;g.gain.value=.05;o.connect(g);g.connect(bus);o.start();return o});
 const sc=[523.25,587.33,659.25,783.99,880];
 const id=setInterval(()=>{if(Math.random()<.7)osc('sine',sc[Math.floor(Math.random()*5)],actx.currentTime+.05,2.2,.05,bus)},700);
 return()=>{pads.forEach(o=>o.stop());clearInterval(id)}}
function startGen(fn){const bus=actx.createGain();bus.connect(master);const stop=fn(bus);
 return()=>{stop();bus.gain.setTargetAtTime(0,actx.currentTime,.05);setTimeout(()=>bus.disconnect(),500)}}
const curTrack=()=>tracks[mIdx]||null;
function mStop(){clearTimeout(advT);if(genStop){genStop();genStop=null}if(fileAud){fileAud.onended=null;fileAud.onerror=null;fileAud.pause();fileAud=null}}
function mStart(){
 const tr=curTrack();mStop();if(!tr)return;
 if(tr.g){const fn=GENF[tr.g];if(!fn)return;ensureCtx();actx.resume().catch(()=>{});genStop=startGen(fn);advT=setTimeout(()=>mNext(true),80000)}
 else{fileAud=new Audio(tr.src);fileAud.loop=tracks.length<2;fileAud.volume=mVol;fileAud.onended=()=>mNext(true);
  fileAud.onerror=()=>toast(T[lang].mBad);const p=fileAud.play();if(p&&p.catch)p.catch(()=>{})}
}
function mToggle(){
 const t=curTrack();if(!t)return;
 if(mPlaying){mPlaying=false;clearTimeout(advT);if(t.g){if(actx)actx.suspend()}else if(fileAud)fileAud.pause()}
 else{mPlaying=true;
  if(t.g&&genStop&&actx){actx.resume();advT=setTimeout(()=>mNext(true),80000)}
  else if(!t.g&&fileAud)fileAud.play().catch(()=>{});else mStart()}
 renderMusic();
}
function mRestart(){if(!curTrack())return;mPlaying=true;mStart();renderMusic()}
function mNext(auto){if(!tracks.length||(auto&&!mPlaying))return;mIdx=(mIdx+1)%tracks.length;mPlaying=true;mStart();renderMusic()}
function mSelect(i){if(!tracks[i])return;mIdx=i;mPlaying=true;mStart();renderMusic()}
function mMove(i,d){const j=i+d;if(j<0||j>=tracks.length)return;const cur=tracks[mIdx],x=tracks.splice(i,1)[0];tracks.splice(j,0,x);mIdx=tracks.indexOf(cur);markDirty();renderMusic()}
function mDelete(i){
 const cur=tracks[mIdx],was=i===mIdx;tracks.splice(i,1);
 if(!tracks.length){mStop();mPlaying=false;mIdx=0}
 else if(was){mIdx=Math.min(i,tracks.length-1);if(mPlaying)mStart();else mStop()}
 else mIdx=tracks.indexOf(cur);
 markDirty();renderMusic();
}
async function mAddFile(file){
 const a=AT(),ext=(file.name.split('.').pop()||'').toLowerCase(),nm=file.name.replace(/\.[^.]+$/,'');
 if(file.size>20*1048576){toast(a.eBig);return}
 try{
  let src,ty=null;
  if(['mp4','m4a','m4b'].includes(ext)||file.type==='video/mp4'||file.type==='audio/mp4'||file.type==='audio/x-m4a')ty='video/mp4';
  else if(ext==='webm'||file.type==='video/webm'||file.type==='audio/webm')ty='video/webm';
  if(ty&&ENV!=='github'){const as=await window.claude.use('assets');if(!as)throw{code:'no_assets'};src=(await as.upload(file,{type:ty})).url}
  else{
   if(file.size>(ENV==='github'?20:8)*1048576){toast(a.eMp3);return}
   src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
   const EM={mp3:'audio/mpeg',m4a:'audio/mp4',m4b:'audio/mp4',mp4:'audio/mp4',webm:'audio/webm',wav:'audio/wav',ogg:'audio/ogg',aac:'audio/aac'};
   src=src.replace(/^data:[^;,]*/,'data:'+(EM[ext]||file.type||'audio/mpeg'));
  }
  tracks.push({name:nm,src:src});markDirty();renderMusic();
 }catch(e){toast(a.eUp)}
}
function renderMusic(){
 const d=T[lang],el=$('mp');if(!el)return;
 $('mbtn').classList.toggle('on',mPlaying&&tracks.length>0);

   h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
  H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

async function upAsset(blob){

function fitImage(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
  const alpha=file.type==='image/png'||file.type==='image/webp';c.toBlob(b=>b?res(b):rej(new Error('blob')),alpha?'image/webp':'image/jpeg',.9)};
 img.onerror=()=>rej(new Error('img'));img.src=u})}

 v.onloadeddata=()=>{try{v.currentTime=Math.min(.6,(v.duration||1)/2)}catch(e){rej(e)}};
 v.onseeked=()=>{const c=document.createElement('canvas');c.width=480;c.height=270;const x=c.getContext('2d'),r=Math.max(480/v.videoWidth,270/v.videoHeight),w=v.videoWidth*r,h=v.videoHeight*r;
  x.drawImage(v,(480-w)/2,(270-h)/2,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.8)};
 v.onerror=()=>rej(new Error('vid'))})}

async function handleUpload(inp){
 const key=inp.dataset.up,f=inp.files&&inp.files[0],a=AT();inp.value='';if(!f)return;
 try{
  if(key==='vid'||key==='clip'){
   if(!/^video\//.test(f.type))throw{code:'type'};if(f.size>20*1048576)throw{code:'big'};
   setMsg(a.upping);const url=await upAsset(f);
   if(key==='vid'){draft.img.vid=url;IMG.vid=url;paint()}
   else{let t='';try{t=await upAsset(await videoThumb(f))}catch(e){t=(draft.clips[0]&&draft.clips[0].t)||''}
    draft.clips.push({s:0,t:t,v:url});CLIPS=draft.clips;renderClips()}
  }else{
   if(!/^image\//.test(f.type))throw{code:'type'};
   setMsg(a.upping);const url=await upAsset(await fitImage(f));
   if(key==='slideadd'){
    if(HS.list.filter(x=>x.t==='image').length>=6){toast(a.hsMax);setMsg('');return}
    HS.list.push({t:'image',id:'s'+Date.now().toString(36),on:1,img:url,link:'shop',txt:{en:{h:'',s:'',b:'Shop now'},ja:{h:'',s:'',b:'ショップへ'},ko:{h:'',s:'',b:'쇼핑하기'}}});paint()}
   else if(key.startsWith('slide:')){const x=HS.list.find(y=>y.id===key.slice(6));if(x){x.img=url;paint()}}
   else{draft.img[key]=url;IMG[key]=url;paint()}

 }catch(e){setMsg(upErr(e))}
}
